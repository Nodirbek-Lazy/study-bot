name: Study Reminder Bot

on:
  schedule:
    # Every 5 minutes (UTC). GitHub may delay runs by a few minutes.
    # Private repo? Free minutes are limited - change to "*/30 * * * *".
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]   # redeploy the Mini App when you edit it

concurrency:
  group: study-bot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}   # optional; defaults to https://<owner>.github.io/<repo>/

      - name: Save database and planner data
        id: save
        run: |
          git config user.name "study-bot"
          git config user.email "study-bot@users.noreply.github.com"
          git add bot.db docs/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update database [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish the Mini App. Runs when the data changed, or on a manual/push run.
      - name: Package Mini App
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish Mini App
        id: deploy
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4